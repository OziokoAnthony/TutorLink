[project]
name = "tutorlink-backend"
version = "0.1.0"
description = "TutorLink REST API — home tutoring platform for Nigerian parents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "resend",
    "httpx",
    "email-validator>=2.3.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "boto3>=1.43.108",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
