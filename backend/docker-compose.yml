# Pinned so the project (and its postgres_data volume) keeps this name wherever the file lives.
name: tutorlink-backend

services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # Inside the container, "localhost" is the app itself — point at the db service instead.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tutorlink_db
    depends_on: [db]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutorlink_db
    ports: ["5435:5432"]  # host 5435: 5432 is a local Windows Postgres, 5433-5434 are taken by WSL
    volumes: [postgres_data:/var/lib/postgresql/data]

  adminer:
    image: adminer
    ports: ["8080:8080"]
    depends_on: [db]

volumes:
  postgres_data:
